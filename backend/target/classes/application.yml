server:
  port: 8080

spring:
  application:
    name: imagereco-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

---
# MySQL Profile (Default)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:imagereco_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

---
# Dev / In-Memory H2 Profile (Seamless fallback / standalone testing)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:imagereco_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

---
# OpenRouter & App Configuration
openrouter:
  api-url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
  api-key: ${OPENROUTER_API_KEY:}
  default-model: ${OPENROUTER_MODEL:openrouter/free}
  app-name: ImageReco AI Visual Analyzer
  site-url: http://localhost:5173

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
